name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t my-devops-site:ci .

      - name: Check website content
        run: |
          docker run --rm --entrypoint grep my-devops-site:ci \
            -q "My website runs with Docker Compose!" \
            /usr/share/nginx/html/index.html
          echo "Website content OK!"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        if: github.event_name == 'push'
        run: |
          docker tag my-devops-site:ci ghcr.io/labavod/devops-learning-site:latest
          docker push ghcr.io/labavod/devops-learning-site:latest
